services:
  gateway:
    profiles: [prod]
    build:
      context: ./../Pollpear_gateway
      dockerfile: Dockerfile
    container_name: pollpear-gateway
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      backend:
         condition: service_started # TODO: a mettre a healthy plus tard
      frontend:
        condition: service_started # TODO: a mettre a healthy plus tard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    networks:
      - gateway-network
      - vault-network

  backend:
    profiles: [prod]
    build:
      context: ./../Pollpear_backend
      dockerfile: Dockerfile
    container_name: pollpear-backend
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    networks:
        - backend-network
        - gateway-network
        - vault-network

  frontend:
    profiles: [prod]
    build:
      context: ./../Pollpear_frontend
      dockerfile: Dockerfile
    container_name: pollpear-frontend
    healthcheck:
      test: ["CMD", "node", "healthcheck.ts"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    networks:
      - gateway-network

  ai:
    profiles: [prod]
    build:
      context: ./../Pollpear_AI
      dockerfile: Dockerfile
    container_name: pollpear-ai
    depends_on:
      vault:
        condition: service_healthy
    # TODO: a implementer une fois que endpoint up
    # healthcheck:
    #   test: ["CMD", "curl -f", "http://localhost:3002/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    restart: on-failure
    networks:
      - backend-network
      - vault-network

  prometheus:
    image: ghcr.io/transummer2026/prometheus@sha256:a75c5a35bc21d7afe69551eefa3cb1e1fb1775fe759408007a66b54ec3de1f29
    container_name: pollpear-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - monitoring-network
  
  grafana:
    image: ghcr.io/transummer2026/grafana@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: pollpear-grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - monitoring-network

  vault:
    build:
      context: ./../Pollpear_cyber
      dockerfile: Dockerfile
    container_name: pollpear-vault
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  postgres:
    image: postgres:16-alpine
    container_name: pollpear-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pollpear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pollpear}
      POSTGRES_DB: ${POSTGRES_DB:-pollpear}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pollpear} -d ${POSTGRES_DB:-pollpear}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    container_name: pollpear-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
      - ./redis:/redis-init:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-network
      - gateway-network

volumes:
  postgres-data:
  redis-data:
  prometheus-data:

networks:
  gateway-network:
    driver: bridge
    name: gateway-network
  vault-network:
    driver: bridge
    name: vault-network
  backend-network:
    driver: bridge
    name: backend-network
  monitoring-network:
    driver: bridge
    name: monitoring-network
  
