name: pollpear
services:
  # SERVICES POLLPEAR
  gateway:
    build:
      context: ./../Pollpear_gateway
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_gateway/Cargo.toml
        - action: sync+restart
          path: ./../Pollpear_gateway/src
          target: /app/src
    container_name: pollpear-gateway
    environment:
      ADMIN_SERVICE_URL: ${BACKEND_URL}
      AUTH_SERVICE_URL: ${BACKEND_URL}
      CONTACT_SERVICE_URL: ${BACKEND_URL}
      FEED_SERVICE_URL: ${BACKEND_URL}
      ME_SERVICE_URL: ${BACKEND_URL}
      POLLS_SERVICE_URL: ${BACKEND_URL}
      ROOMS_SERVICE_URL: ${BACKEND_URL}
      SEARCH_SERVICE_URL: ${BACKEND_URL}
      USERS_SERVICE_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      garage:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - core-network
      - backend-network

  backend:
    build:
      context: ./../Pollpear_backend
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.NESTJS_PORT ?? 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_backend/package.json
        - action: sync+restart
          path: ./../Pollpear_backend/src
          target: /app/src
        - action: sync+restart
          path: ./../Pollpear_backend/Pollpear_shared/src
          target: /app/Pollpear_shared/src
    container_name: pollpear-backend
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      NESTJS_PEPPER: ${NESTJS_PEPPER}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: ${REDIS_URL}
      GARAGE_S3_ENDPOINT: ${GARAGE_S3_ENDPOINT}
      GARAGE_S3_REGION: ${GARAGE_S3_REGION}
      GARAGE_S3_BUCKET: ${GARAGE_S3_BUCKET}
      GARAGE_S3_ACCESS_KEY: ${GARAGE_S3_ACCESS_KEY}
      GARAGE_S3_SECRET_KEY: ${GARAGE_S3_SECRET_KEY}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - core-network
      - backend-network

  frontend:
    build:
      context: ./../Pollpear_frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: ${BACKEND_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_frontend/package.json
        - action: sync
          path: ./../Pollpear_frontend/src
          target: /app/src
        - action: sync
          path: ./../Pollpear_frontend/Pollpear_shared/src
          target: /app/Pollpear_shared/src
    container_name: pollpear-frontend
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - core-network

  ai:
    build:
      context: ./../Pollpear_ai
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_ai/requirements.txt
        - action: sync+restart
          path: ./../Pollpear_ai/src
          target: /app/src
    container_name: pollpear-ai
    depends_on:
      vault:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-network

  # Services infra
  vault:
    build:
      context: ./../Pollpear_cyber
      dockerfile: Dockerfile
    container_name: pollpear-vault
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  postgres:
    image: ghcr.io/transummer2026/postgres:16-alpine
    container_name: pollpear-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pollpear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pollpear}
      POSTGRES_DB: ${POSTGRES_DB:-pollpear}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pollpear} -d ${POSTGRES_DB:-pollpear}",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  redis:
    image: ghcr.io/transummer2026/redis:7-alpine
    container_name: pollpear-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
      - ./redis:/redis-init:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - backend-network

  garage:
    image: ghcr.io/transummer2026/garage:v2.3.0
    container_name: pollpear-garage
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is not set in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is not set in .env}
    volumes:
      - garage-data:/var/lib/garage
      - ./garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

volumes:
  postgres-data:
    name: pollpear-postgres-data
  redis-data:
    name: pollpear-redis-data
  garage-data:
    name: pollpear-garage-data

networks:
  core-network:
    driver: bridge
    name: core-network
  backend-network:
    driver: bridge
    name: backend-network
  monitoring-network:
    driver: bridge
    name: monitoring-network