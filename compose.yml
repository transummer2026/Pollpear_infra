services:

  gateway:
    profiles: [prod]
    build:
      context: ./../Pollpear_gateway
      dockerfile: Dockerfile
    container_name: pollpear-gateway
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      backend:
         condition: service_started # TODO: a mettre a healthy plus tard
      frontend:
        condition: service_started # TODO: a mettre a healthy plus tard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    networks:
      - core-network
      - backend-network

  backend:
    profiles: [prod]
    build:
      context: ./../Pollpear_backend
      dockerfile: Dockerfile
    container_name: pollpear-backend
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    networks:
        - core-network
        - backend-network

  frontend:
    profiles: [prod]
    build:
      context: ./../Pollpear_frontend
      dockerfile: Dockerfile
    container_name: pollpear-frontend
    healthcheck:
      test: ["CMD", "node", "healthcheck.ts"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    networks:
      - core-network

  ai:
    profiles: [prod]
    build:
      context: ./../Pollpear_AI
      dockerfile: Dockerfile
    container_name: pollpear-ai
    depends_on:
      vault:
        condition: service_healthy
    # TODO: a implementer une fois que endpoint up
    # healthcheck:
    #   test: ["CMD", "curl -f", "http://localhost:3002/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    restart: on-failure
    networks:
      - backend-network


  vault:
    image: ghcr.io/transummer2026/vault@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
    container_name: pollpear-vault
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  postgres:
    image: postgres:16-alpine
    container_name: pollpear-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pollpear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pollpear}
      POSTGRES_DB: ${POSTGRES_DB:-pollpear}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pollpear} -d ${POSTGRES_DB:-pollpear}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  redis:
    image: redis:7-alpine
    container_name: pollpear-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
      - ./redis:/redis-init:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-network

  prometheus:
    image: ghcr.io/transummer2026/prometheus@sha256:a75c5a35bc21d7afe69551eefa3cb1e1fb1775fe759408007a66b54ec3de1f29
    container_name: pollpear-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
      #- --log.level=debug
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - monitoring-network
  
  grafana:
    image: ghcr.io/transummer2026/grafana@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: pollpear-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER is not set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is not set in .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - monitoring-network

  node-exporter:
    image: ghcr.io/transummer2026/node-exporter@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205
    container_name: pollpear-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    networks:
      - monitoring-network

  postgres-exporter:
    image: ghcr.io/transummer2026/postgres-exporter@sha256:215b8299a47328078dabb751d2ffc1fd9a0aad3aa8c7daed36c567d2bd83a8a1
    container_name: pollpear-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-pollpear}:${POSTGRES_PASSWORD:-pollpear}@postgres:5432/${POSTGRES_DB:-pollpear}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-network
      - monitoring-network

  redis-exporter:
    image: ghcr.io/transummer2026/redis-exporter@sha256:2e9795be900db073e9475fdb9c5124db309b07a3e4e75a1770705cb03be1a1c8
    container_name: pollpear-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-network
      - monitoring-network

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  
networks:
  core-network:
    driver: bridge
    name: core-network
  backend-network:
    driver: bridge
    name: backend-network
  monitoring-network:
    driver: bridge
    name: monitoring-network
  
