services:
  # SERVICES POLLPEAR
  gateway:
    build:
      context: ./../Pollpear_gateway
      dockerfile: Dockerfile
    container_name: pollpear-gateway
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      backend:
        condition: service_started # TODO: a mettre a healthy plus tard
      frontend:
        condition: service_started # TODO: a mettre a healthy plus tard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    networks:
      - core-network
      - backend-network

  backend:
    build:
      context: ./../Pollpear_backend
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_backend/package.json
        - action: sync+restart
          path: ./../Pollpear_backend/src
          target: /app/src
    container_name: pollpear-backend
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      NESTJS_PEPPER: ${NESTJS_PEPPER}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    networks:
      - core-network
      - backend-network

  frontend:
    build:
      context: ./../Pollpear_frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: ${BACKEND_URL}
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_frontend/package.json
        - action: sync
          path: ./../Pollpear_frontend/src
          target: /app/src
    container_name: pollpear-frontend
    healthcheck:
      test: ["CMD", "node", "healthcheck.ts"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    networks:
      - core-network

  ai:
    build:
      context: ./../Pollpear_AI
      dockerfile: Dockerfile
    container_name: pollpear-ai
    depends_on:
      vault:
        condition: service_healthy
    # TODO: a implementer une fois que endpoint up
    # healthcheck:
    #   test: ["CMD", "curl -f", "http://localhost:3002/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    restart: on-failure
    networks:
      - backend-network

  # Services infra
  vault:
    build:
      context: ./../Pollpear_cyber
      dockerfile: Dockerfile
    container_name: pollpear-vault
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  postgres:
    image: ghcr.io/transummer2026/postgres:16-alpine
    container_name: pollpear-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pollpear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pollpear}
      POSTGRES_DB: ${POSTGRES_DB:-pollpear}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pollpear} -d ${POSTGRES_DB:-pollpear}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  redis:
    image: ghcr.io/transummer2026/redis:7-alpine
    container_name: pollpear-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
      - ./redis:/redis-init:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-network

  prometheus:
    image: ghcr.io/transummer2026/prometheus:latest
    container_name: pollpear-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
      #- --log.level=debug
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  grafana:
    image: ghcr.io/transummer2026/grafana:latest
    container_name: pollpear-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER is not set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is not set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - monitoring-network

  alertmanager:
    image: ghcr.io/transummer2026/alertmanager:latest
    container_name: pollpear-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - monitoring-network

  # Exporters
  node-exporter:
    image: ghcr.io/transummer2026/node-exporter:latest
    container_name: pollpear-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro
    restart: unless-stopped
    networks:
      - monitoring-network

  postgres-exporter:
    image: ghcr.io/transummer2026/postgres-exporter:latest
    container_name: pollpear-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-pollpear}:${POSTGRES_PASSWORD:-pollpear}@postgres:5432/${POSTGRES_DB:-pollpear}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-network
      - monitoring-network

  cadvisor:
    image: ghcr.io/transummer2026/cadvisor:latest
    container_name: pollpear-cadvisor
    command:
      - --docker_only=true
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - monitoring-network

  redis-exporter:
    image: ghcr.io/transummer2026/redis-exporter:latest
    container_name: pollpear-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-network
      - monitoring-network

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  core-network:
    driver: bridge
    name: core-network
  backend-network:
    driver: bridge
    name: backend-network
  monitoring-network:
    driver: bridge
    name: monitoring-network

