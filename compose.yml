name: pollpear
services:
  # SERVICES POLLPEAR
  gateway:
    build:
      context: ./../Pollpear_gateway
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_gateway/Cargo.toml
        - action: sync+restart
          path: ./../Pollpear_gateway/src
          target: /app/src
    container_name: pollpear-gateway
    environment:
      ADMIN_SERVICE_URL: ${BACKEND_URL}
      AUTH_SERVICE_URL: ${BACKEND_URL}
      CONTACT_SERVICE_URL: ${BACKEND_URL}
      FEED_SERVICE_URL: ${BACKEND_URL}
      ME_SERVICE_URL: ${BACKEND_URL}
      POLLS_SERVICE_URL: ${BACKEND_URL}
      ROOMS_SERVICE_URL: ${BACKEND_URL}
      SEARCH_SERVICE_URL: ${BACKEND_URL}
      USERS_SERVICE_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: on-failure
    networks:
      - core-network
      - backend-network

  backend:
    build:
      context: ./../Pollpear_backend
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_backend/package.json
        - action: sync+restart
          path: ./../Pollpear_backend/src
          target: /app/src
    container_name: pollpear-backend
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      NESTJS_PEPPER: ${NESTJS_PEPPER}
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - core-network
      - backend-network

  frontend:
    build:
      context: ./../Pollpear_frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: ${BACKEND_URL}
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_frontend/package.json
        - action: sync
          path: ./../Pollpear_frontend/src
          target: /app/src
    container_name: pollpear-frontend
    restart: on-failure
    networks:
      - core-network

  ai:
    build:
      context: ./../Pollpear_ai
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_ai/requirements.txt
        - action: sync+restart
          path: ./../Pollpear_ai/src
          target: /app/src
    container_name: pollpear-ai
    depends_on:
      vault:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-network

  # Services infra
  vault:
    build:
      context: ./../Pollpear_cyber
      dockerfile: Dockerfile
    container_name: pollpear-vault
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  postgres:
    image: ghcr.io/transummer2026/postgres:16-alpine
    container_name: pollpear-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pollpear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pollpear}
      POSTGRES_DB: ${POSTGRES_DB:-pollpear}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pollpear} -d ${POSTGRES_DB:-pollpear}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  redis:
    image: ghcr.io/transummer2026/redis:7-alpine
    container_name: pollpear-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
      - ./redis:/redis-init:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-network

volumes:
  postgres-data:
    name: pollpear-postgres-data
  redis-data:
    name: pollpear-redis-data

networks:
  core-network:
    driver: bridge
    name: core-network
  backend-network:
    driver: bridge
    name: backend-network
  monitoring-network:
    driver: bridge
    name: monitoring-network