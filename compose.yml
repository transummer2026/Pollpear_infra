name: pollpear
services:
  # Pollpear application services (built from sibling repos in the super-repo).
  # Rust edge gateway: single entry point behind nginx, fronts the backend and
  # holds the WebSocket connections. Reads its own secrets from Vault via AppRole.
  gateway:
    build:
      context: ./../Pollpear_gateway
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_gateway/Cargo.toml
        - action: sync+restart
          path: ./../Pollpear_gateway/src
          target: /app/src
    container_name: pollpear-gateway
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      APPROLE_ENV: pollpear-gateway.env
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-approle-entrypoint.sh:/usr/local/bin/vault-approle-entrypoint.sh:ro
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      garage:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - core-network
      - backend-network

  # NestJS backend (REST + Prisma/Postgres). Entrypoint sources its Vault AppRole
  # before starting so the app can pull DATABASE_URL and friends from Vault.
  backend:
    build:
      context: ./../Pollpear_backend
      dockerfile: Dockerfile
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:' + (process.env.NESTJS_PORT ?? 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_backend/package.json
        - action: sync+restart
          path: ./../Pollpear_backend/src
          target: /app/src
        - action: sync+restart
          path: ./../Pollpear_backend/Pollpear_shared/src
          target: /app/Pollpear_shared/src
    container_name: pollpear-backend
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      APPROLE_ENV: pollpear-backend.env
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-approle-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-approle-entrypoint.sh:/usr/local/bin/vault-approle-entrypoint.sh:ro
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - core-network
      - backend-network

  # Frontend (Vite/React). In dev it runs the dev server; in prod (compose.prod.yml)
  # it builds static assets into the front-dist volume that nginx serves.
  frontend:
    build:
      context: ./../Pollpear_frontend
      dockerfile: Dockerfile
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      APPROLE_ENV: pollpear-frontend.env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_frontend/package.json
        - action: sync
          path: ./../Pollpear_frontend/src
          target: /app/src
        - action: sync
          path: ./../Pollpear_frontend/Pollpear_shared/src
          target: /app/Pollpear_shared/src
    container_name: pollpear-frontend
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - core-network

  # Python/FastAPI AI service, reachable only on the internal backend-network
  # (via the gateway), not exposed through nginx.
  ai:
    build:
      context: ./../Pollpear_ai
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./../Pollpear_ai/requirements.txt
        - action: sync+restart
          path: ./../Pollpear_ai/src
          target: /app/src
    container_name: pollpear-ai
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      APPROLE_ENV: pollpear-ai.env
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-approle-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-approle-entrypoint.sh:/usr/local/bin/vault-approle-entrypoint.sh:ro
    depends_on:
      vault:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-network

  # Infrastructure services
  # HashiCorp Vault (dev mode). Source of truth for every secret; the post_start
  # hook seeds the KV store from Pollpear_cyber/.env and writes each service's
  # AppRole credentials onto the shared vault-approle volume.
  vault:
    build:
      context: ./../Pollpear_cyber
      dockerfile: Dockerfile
    image: pollpear-vault:dev
    container_name: pollpear-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-root}
      VAULT_ADDR: ${VAULT_ADDR:-http://127.0.0.1:8200}
    volumes:
      - vault-approle:/vault/approle
      - vault-logs:/vault/logs
      # Secret material to seed into Vault, mounted read-only from Pollpear_cyber.
      - ./../Pollpear_cyber/.env:/run/secrets/dotenv:ro
    # Runs after the container starts (Vault is up): populate KV secrets and emit
    # the per-service AppRole files the side-cars and app entrypoints wait on.
    post_start:
      - command:
          - /bin/sh
          - -c
          - /usr/local/bin/seed.sh
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  # Secrets side-car pattern (repeated per service): a short-lived Vault agent that
  # authenticates with the service's AppRole, renders secret files into a dedicated
  # <service>-secrets volume, then exits. The real service depends on it with
  # `service_completed_successfully` so it only starts once its secrets exist.
  # $SERVICE selects which AppRole/agent config to use.
  postgres-secrets:
    image: pollpear-vault:dev
    container_name: pollpear-postgres-secrets
    user: root
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      SERVICE: pollpear-postgres
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-agent-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-agent-entrypoint.sh:/usr/local/bin/vault-agent-entrypoint.sh:ro
      - ./vault-agent/agent-postgres.hcl:/agent/agent.hcl:ro
      - postgres-secrets:/secrets
    depends_on:
      vault:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-network

  postgres:
    image: ghcr.io/transummer2026/postgres:16-alpine
    container_name: pollpear-postgres
    # Credentials read from files rendered by postgres-secrets (never inline in env).
    environment:
      POSTGRES_USER_FILE: /secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
      POSTGRES_DB_FILE: /secrets/postgres_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # SQL run once on an empty data dir to bootstrap the database.
      - ./postgres:/docker-entrypoint-initdb.d:ro
      - postgres-secrets:/secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$(cat /secrets/postgres_user)\" -d \"$$(cat /secrets/postgres_db)\"",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    depends_on:
      postgres-secrets:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  redis-secrets:
    image: pollpear-vault:dev
    container_name: pollpear-redis-secrets
    user: root
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      SERVICE: pollpear-redis
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-agent-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-agent-entrypoint.sh:/usr/local/bin/vault-agent-entrypoint.sh:ro
      - ./vault-agent/agent-redis.hcl:/agent/agent.hcl:ro
      - redis-secrets:/secrets
    depends_on:
      vault:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-network

  redis:
    image: ghcr.io/transummer2026/redis:7-alpine
    container_name: pollpear-redis
    # redis.conf (with requirepass) is rendered by redis-secrets; AOF persistence on.
    command: ["redis-server", "/secrets/redis.conf", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
      - ./redis:/redis-init:ro
      - redis-secrets:/secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$(cat /secrets/password)\" ping | grep -q PONG",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    depends_on:
      redis-secrets:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend-network

  garage-secrets:
    image: pollpear-vault:dev
    container_name: pollpear-garage-secrets
    user: root
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      SERVICE: pollpear-garage
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-agent-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-agent-entrypoint.sh:/usr/local/bin/vault-agent-entrypoint.sh:ro
      - ./vault-agent/agent-garage.hcl:/agent/agent.hcl:ro
      - garage-secrets:/secrets
    depends_on:
      vault:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-network

  # Garage: self-hosted S3-compatible object store (avatars, uploads). Provisioned
  # by scripts/garage-init.sh once healthy. Secrets rendered by garage-secrets.
  garage:
    image: ghcr.io/transummer2026/garage:v2.3.0
    container_name: pollpear-garage
    environment:
      GARAGE_RPC_SECRET_FILE: /secrets/rpc_secret
      GARAGE_ADMIN_TOKEN_FILE: /secrets/admin_token
    volumes:
      - garage-data:/var/lib/garage
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    depends_on:
      garage-secrets:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

volumes:
  postgres-data:
    name: pollpear-postgres-data
  postgres-secrets:
    name: pollpear-postgres-secrets
  redis-data:
    name: pollpear-redis-data
  redis-secrets:
    name: pollpear-redis-secrets
  garage-secrets:
    name: pollpear-garage-secrets
  garage-data:
    name: pollpear-garage-data
  vault-approle:
    name: pollpear-vault-approle
  vault-logs:
    name: pollpear-vault-logs

networks:
  # Edge/user-facing path: nginx, frontend, gateway.
  core-network:
    driver: bridge
    name: core-network
  # Internal service mesh: backend, datastores, AI, gateway.
  backend-network:
    driver: bridge
    name: backend-network
  # Prometheus scraping and exporters, kept off the app networks where possible.
  monitoring-network:
    driver: bridge
    name: monitoring-network
