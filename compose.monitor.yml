services:
  prometheus:
    image: ghcr.io/transummer2026/prometheus:latest
    container_name: pollpear-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
      #- --log.level=debug
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - core-network
      - backend-network
      - monitoring-network

  grafana-secrets:
    image: pollpear-vault:dev
    container_name: pollpear-grafana-secrets
    user: root
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE: pollpear-grafana
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-agent-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-agent-entrypoint.sh:/usr/local/bin/vault-agent-entrypoint.sh:ro
      - ./vault-agent/agent-grafana.hcl:/agent/agent.hcl:ro
      - grafana-secrets:/secrets
    depends_on:
      vault:
        condition: service_healthy
    restart: on-failure
    networks:
      - monitoring-network

  grafana:
    image: ghcr.io/transummer2026/grafana:latest
    container_name: pollpear-grafana
    entrypoint:
      - /bin/sh
      - -ec
      - |
        . /secrets/grafana.env
        export GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD GF_USERS_ALLOW_SIGN_UP
        exec /run.sh
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
      - grafana-secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    depends_on:
      grafana-secrets:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - monitoring-network

  alertmanager:
    image: ghcr.io/transummer2026/alertmanager:latest
    container_name: pollpear-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - monitoring-network

  # Exporters
  node-exporter:
    image: ghcr.io/transummer2026/node-exporter:latest
    container_name: pollpear-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - monitoring-network

  postgres-exporter-secrets:
    image: pollpear-vault:dev
    container_name: pollpear-postgres-exporter-secrets
    user: root
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE: pollpear-postgres-exporter
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-agent-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-agent-entrypoint.sh:/usr/local/bin/vault-agent-entrypoint.sh:ro
      - ./vault-agent/agent-postgres-exporter.hcl:/agent/agent.hcl:ro
      - postgres-exporter-secrets:/secrets
    depends_on:
      vault:
        condition: service_healthy
    restart: on-failure
    networks:
      - monitoring-network

  postgres-exporter:
    image: ghcr.io/transummer2026/postgres-exporter:latest
    container_name: pollpear-postgres-exporter
    environment:
      DATA_SOURCE_URI_FILE: /secrets/pg_uri
      DATA_SOURCE_USER_FILE: /secrets/pg_user
      DATA_SOURCE_PASS_FILE: /secrets/pg_pass
    volumes:
      - postgres-exporter-secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-exporter-secrets:
        condition: service_completed_successfully
    # sonde sur / (liveness HTTP) et non /metrics : évite une salve de requêtes DB toutes les 10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - backend-network
      - monitoring-network

  cadvisor:
    image: ghcr.io/transummer2026/cadvisor:latest
    container_name: pollpear-cadvisor
    command:
      - --docker_only=true
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - monitoring-network

  redis-exporter-secrets:
    image: pollpear-vault:dev
    container_name: pollpear-redis-exporter-secrets
    user: root
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE: pollpear-redis-exporter
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-agent-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-agent-entrypoint.sh:/usr/local/bin/vault-agent-entrypoint.sh:ro
      - ./vault-agent/agent-redis-exporter.hcl:/agent/agent.hcl:ro
      - redis-exporter-secrets:/secrets
    depends_on:
      vault:
        condition: service_healthy
    restart: on-failure
    networks:
      - monitoring-network

  # pas de healthcheck : image scratch (aucun shell/wget pour sonder /metrics)
  redis-exporter:
    image: ghcr.io/transummer2026/redis-exporter:latest
    container_name: pollpear-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD_FILE: /secrets/redis-password
    volumes:
      - redis-exporter-secrets:/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      redis-exporter-secrets:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend-network
      - monitoring-network

volumes:
  prometheus-data:
    name: pollpear-prometheus-data
  grafana-data:
    name: pollpear-grafana-data
  grafana-secrets:
    name: pollpear-grafana-secrets
  redis-exporter-secrets:
    name: pollpear-redis-exporter-secrets
  postgres-exporter-secrets:
    name: pollpear-postgres-exporter-secrets
  alertmanager-data:
    name: pollpear-alertmanager-data

networks:
  core-network:
    driver: bridge
    name: core-network
  backend-network:
    driver: bridge
    name: backend-network
  monitoring-network:
    driver: bridge
    name: monitoring-network

