name: CI

on:
  pull_request:
    branches: [dev, main, staging]
  push:
    branches: ["dev"]
  repository_dispatch:
    types: [ci-trigger]
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI infra déclenché"

  ci:
    needs: trigger
    uses: transummer2026/.github/.github/workflows/ci-service.yml@main
    with:
      service_name: infra
      lint_cmd: echo "no lint"
      test_cmd: echo "no tests"
      build_cmd: echo "no build"
      coverage_threshold: 0
    secrets:
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      DISCORD_WEBHOOK_REPO: ${{ secrets.DISCORD_WEBHOOK_INFRA }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
