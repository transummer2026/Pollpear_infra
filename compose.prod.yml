# Prod overlay: adds the public edge (nginx + ModSecurity WAF, certbot), switches
# every service to its `prod` build target, and has the frontend emit static assets
# instead of running a dev server. Layered on top of compose.yml + compose.monitor.yml.
services:

  # nginx with the ModSecurity WAF: TLS termination and the only public entry point.
  # Host 80/443 map to the container's unprivileged 8080/8443 (see the vhost template).
  nginx:
    image: ghcr.io/transummer2026/modsecurity:latest
    container_name: pollpear-nginx
    user: root
    ports:
      - "${NGINX_HTTP_PORT:-80}:8080"
      - "${NGINX_HTTPS_PORT:-443}:8443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is not set in .env}
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-443}
    # Load the WAF tuning env (from nginx-secrets) before launching nginx.
    entrypoint: ["/bin/sh", "/usr/local/bin/waf-env-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./scripts/waf-env-entrypoint.sh:/usr/local/bin/waf-env-entrypoint.sh:ro
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./nginx/99-cert-reload.sh:/docker-entrypoint.d/99-cert-reload.sh:ro
      - ./nginx/srv:/srv:ro
      - front-dist:/usr/share/nginx/html:ro
      - nginx-secrets:/secrets:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    # Wait until the static build is in front-dist, config.json is rendered, and
    # the auth/WAF secrets exist before nginx starts serving.
    depends_on:
      frontend:
        condition: service_completed_successfully
      frontend-secrets:
        condition: service_completed_successfully
      nginx-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - core-network
      - monitoring-network

  # Certbot side-car: long-running renewal loop (renew-loop.sh) that shares the cert
  # and webroot volumes with nginx. Initial issuance is done by ensure-certs.sh.
  certbot:
    image: ghcr.io/transummer2026/certbot:latest
    container_name: pollpear-certbot
    entrypoint: ["/bin/sh", "/renew-loop.sh"]
    volumes:
      - ./nginx/renew-loop.sh:/renew-loop.sh:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    restart: unless-stopped

  gateway:
    build:
      target: prod
    image: pollpear-gateway:prod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s

  backend:
    build:
      target: prod
    image: pollpear-backend:prod
    command: ["node", "dist/src/main"]

  # In prod the frontend is a build job, not a server: it compiles static assets
  # into the front-dist volume (mounted at /out) and exits, so nginx can serve them.
  frontend:
    build:
      target: prod
    image: pollpear-frontend:prod
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - front-dist:/out

  # Secrets side-car: renders config.json (gateway URL) into front-dist. Runs after
  # the frontend build so it does not race the assets it sits next to.
  frontend-secrets:
    image: pollpear-vault:dev
    container_name: pollpear-frontend-secrets
    user: root
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      SERVICE: pollpear-frontend
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-agent-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-agent-entrypoint.sh:/usr/local/bin/vault-agent-entrypoint.sh:ro
      - ./vault-agent/agent-frontend.hcl:/agent/agent.hcl:ro
      - front-dist:/secrets
    depends_on:
      vault:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - core-network

  # Secrets side-car: renders the basic-auth (htpasswd, auth.conf) and WAF env files
  # nginx consumes.
  nginx-secrets:
    image: pollpear-vault:dev
    container_name: pollpear-nginx-secrets
    user: root
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      SERVICE: pollpear-nginx
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-agent-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-agent-entrypoint.sh:/usr/local/bin/vault-agent-entrypoint.sh:ro
      - ./vault-agent/agent-nginx.hcl:/agent/agent.hcl:ro
      - nginx-secrets:/secrets
    depends_on:
      vault:
        condition: service_healthy
    restart: on-failure
    networks:
      - core-network

  ai:
    build:
      target: prod
    image: pollpear-ai:prod
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "3002", "--workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/health', timeout=4)"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s

volumes:
  certbot-certs:
    name: pollpear-certbot-certs
  certbot-webroot:
    name: pollpear-certbot-webroot
  front-dist:
    name: pollpear-front-dist
  nginx-secrets:
    name: pollpear-nginx-secrets