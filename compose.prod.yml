services:
  nginx:
    image: ghcr.io/transummer2026/nginx:alpine
    container_name: pollpear-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is not set in .env}
      NGINX_AUTH: ${NGINX_AUTH:?NGINX_AUTH is not set in .env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./nginx/99-cert-reload.sh:/docker-entrypoint.d/99-cert-reload.sh:ro
      - ./nginx/srv:/srv:ro
      - front-dist:/usr/share/nginx/html:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      frontend-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - core-network
      - monitoring-network

  certbot:
    image: ghcr.io/transummer2026/certbot:latest
    container_name: pollpear-certbot
    entrypoint: ["/bin/sh", "/renew-loop.sh"]
    volumes:
      - ./nginx/renew-loop.sh:/renew-loop.sh:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    restart: unless-stopped

  gateway:
    build:
      target: prod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s

  backend:
    build:
      target: prod
    command: ["node", "dist/src/main"]

  frontend:
    build:
      target: prod
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - front-dist:/out

  frontend-secrets:
    image: pollpear-vault:dev
    container_name: pollpear-frontend-secrets
    user: root
    environment:
      VAULT_ADDR: http://vault:8200
    healthcheck:
      disable: true
    entrypoint:
      - /bin/sh
      - -ec
      - |
        i=0
        until [ -f /vault/approle/pollpear-frontend.env ]; do
          if [ "$$i" -ge 60 ]; then echo "timeout waiting for approle creds" >&2; exit 1; fi
          i=$$((i+1)); sleep 1
        done
        . /vault/approle/pollpear-frontend.env
        printf '%s' "$$ROLE_ID" > /tmp/role_id
        printf '%s' "$$SECRET_ID" > /tmp/secret_id
        exec vault agent -config=/agent/agent-frontend.hcl -exit-after-auth
    volumes:
      - vault-approle:/vault/approle:ro
      - ./vault-agent/agent-frontend.hcl:/agent/agent-frontend.hcl:ro
      - front-dist:/secrets
    depends_on:
      vault:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - core-network

  ai:
    build:
      target: prod
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "3002", "--workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/health', timeout=4)"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s

  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

volumes:
  certbot-certs:
    name: pollpear-certbot-certs
  certbot-webroot:
    name: pollpear-certbot-webroot
  front-dist:
    name: pollpear-front-dist