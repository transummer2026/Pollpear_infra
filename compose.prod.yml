services:

  nginx:
    image: ghcr.io/transummer2026/modsecurity:latest
    container_name: pollpear-nginx
    user: root
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is not set in .env}
      ACCESSLOG: "${ACCESSLOG:-/var/log/nginx/access.log}"
      ALLOWED_HTTP_VERSIONS: "${ALLOWED_HTTP_VERSIONS:-HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0}"
      ALLOWED_METHODS: "${ALLOWED_METHODS:-GET HEAD POST OPTIONS}"
      ALLOWED_REQUEST_CONTENT_TYPE: "${ALLOWED_REQUEST_CONTENT_TYPE:-|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|}"
      ALLOWED_REQUEST_CONTENT_TYPE_CHARSET: "${ALLOWED_REQUEST_CONTENT_TYPE_CHARSET:-|utf-8| |iso-8859-1| |iso-8859-15| |windows-1252|}"
      ANOMALY_INBOUND: "${ANOMALY_INBOUND:-5}"
      ANOMALY_OUTBOUND: "${ANOMALY_OUTBOUND:-4}"
      BACKEND: ${BACKEND:?BACKEND is not set in .env}
      BLOCKING_PARANOIA: "${BLOCKING_PARANOIA:-1}"
      CLIENT_BODY_TIMEOUT: "${CLIENT_BODY_TIMEOUT:-10s}"
      CORS_HEADER_403_ALLOW_METHODS: "${CORS_HEADER_403_ALLOW_METHODS:-GET, POST, PUT, DELETE, OPTIONS}"
      CORS_HEADER_403_ALLOW_ORIGIN: "${CORS_HEADER_403_ALLOW_ORIGIN:-*}"
      CORS_HEADER_403_CONTENT_TYPE: "${CORS_HEADER_403_CONTENT_TYPE:-text/html}"
      CORS_HEADER_403_MAX_AGE: "${CORS_HEADER_403_MAX_AGE:-3600}"
      CRS_DISABLE_PLUGINS: "${CRS_DISABLE_PLUGINS:-0}"
      CRS_ENABLE_TEST_MARKER: "${CRS_ENABLE_TEST_MARKER:-0}"
      DETECTION_PARANOIA: "${DETECTION_PARANOIA:-1}"
      ENFORCE_BODYPROC_URLENCODED: "${ENFORCE_BODYPROC_URLENCODED:-0}"
      ERRORLOG: "${ERRORLOG:-/proc/self/fd/2}"
      HTTP2: "${HTTP2:-on}"
      KEEPALIVE_TIMEOUT: "${KEEPALIVE_TIMEOUT:-60s}"
      LOGLEVEL: "${LOGLEVEL:-warn}"
      MANUAL_MODE: "${MANUAL_MODE:-0}"
      METRICS_ALLOW_FROM: "${METRICS_ALLOW_FROM:-127.0.0.0/24}"
      METRICS_DENY_FROM: "${METRICS_DENY_FROM:-all}"
      METRICSLOG: "${METRICSLOG:-/dev/null}"
      MODSEC_ARGUMENTS_LIMIT: "${MODSEC_ARGUMENTS_LIMIT:-1000}"
      MODSEC_AUDIT_ENGINE: "${MODSEC_AUDIT_ENGINE:-RelevantOnly}"
      MODSEC_AUDIT_LOG: "${MODSEC_AUDIT_LOG:-/dev/stdout}"
      MODSEC_AUDIT_LOG_FORMAT: "${MODSEC_AUDIT_LOG_FORMAT:-JSON}"
      MODSEC_AUDIT_LOG_PARTS: "${MODSEC_AUDIT_LOG_PARTS:-ABIJDEFHZ}"
      MODSEC_AUDIT_LOG_RELEVANT_STATUS: "${MODSEC_AUDIT_LOG_RELEVANT_STATUS:-^(?:5|4(?!04))}"
      MODSEC_AUDIT_LOG_TYPE: "${MODSEC_AUDIT_LOG_TYPE:-Serial}"
      MODSEC_AUDIT_STORAGE_DIR: "${MODSEC_AUDIT_STORAGE_DIR:-/var/log/modsecurity/audit/}"
      MODSEC_DATA_DIR: "${MODSEC_DATA_DIR:-/tmp/modsecurity/data}"
      MODSEC_DEBUG_LOG: "${MODSEC_DEBUG_LOG:-/dev/null}"
      MODSEC_DEBUG_LOGLEVEL: "${MODSEC_DEBUG_LOGLEVEL:-0}"
      MODSEC_REQ_BODY_ACCESS: "${MODSEC_REQ_BODY_ACCESS:-on}"
      MODSEC_REQ_BODY_JSON_DEPTH_LIMIT: "${MODSEC_REQ_BODY_JSON_DEPTH_LIMIT:-512}"
      MODSEC_REQ_BODY_LIMIT: "${MODSEC_REQ_BODY_LIMIT:-13107200}"
      MODSEC_REQ_BODY_LIMIT_ACTION: "${MODSEC_REQ_BODY_LIMIT_ACTION:-Reject}"
      MODSEC_REQ_BODY_NOFILES_LIMIT: "${MODSEC_REQ_BODY_NOFILES_LIMIT:-131072}"
      MODSEC_RESP_BODY_ACCESS: "${MODSEC_RESP_BODY_ACCESS:-on}"
      MODSEC_RESP_BODY_LIMIT: "${MODSEC_RESP_BODY_LIMIT:-1048576}"
      MODSEC_RESP_BODY_LIMIT_ACTION: "${MODSEC_RESP_BODY_LIMIT_ACTION:-ProcessPartial}"
      MODSEC_RESP_BODY_MIMETYPE: "${MODSEC_RESP_BODY_MIMETYPE:-text/plain text/html text/xml}"
      MODSEC_RULE_ENGINE: "${MODSEC_RULE_ENGINE:-on}"
      MODSEC_STATUS_ENGINE: "${MODSEC_STATUS_ENGINE:-Off}"
      MODSEC_TAG: "${MODSEC_TAG:-modsecurity}"
      MODSEC_TMP_DIR: "${MODSEC_TMP_DIR:-/tmp/modsecurity/tmp}"
      MODSEC_UNICODE_MAPPING: "${MODSEC_UNICODE_MAPPING:-20127}"
      MODSEC_UPLOAD_DIR: "${MODSEC_UPLOAD_DIR:-/tmp/modsecurity/upload}"
      MODSEC_UPLOAD_FILE_MODE: "${MODSEC_UPLOAD_FILE_MODE:-0600}"
      MODSEC_UPLOAD_KEEP_FILES: "${MODSEC_UPLOAD_KEEP_FILES:-Off}"
      NGINX_ALWAYS_TLS_REDIRECT: "${NGINX_ALWAYS_TLS_REDIRECT:-off}"
      NGINX_PORT_IN_REDIRECT: "${NGINX_PORT_IN_REDIRECT:-off}"
      NGINX_WORKER_PROCESSES: "${NGINX_WORKER_PROCESSES:-auto}"
      PORT: "${PORT:-8080}"
      PROXY_SSL: "${PROXY_SSL:-off}"
      PROXY_SSL_CERT_FILE: "${PROXY_SSL_CERT_FILE:-/etc/nginx/conf/proxy.crt}"
      PROXY_SSL_CERT_KEY_FILE: "${PROXY_SSL_CERT_KEY_FILE:-/etc/nginx/conf/proxy.key}"
      PROXY_SSL_CIPHERS: "${PROXY_SSL_CIPHERS:-ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384}"
      PROXY_SSL_PROTOCOLS: "${PROXY_SSL_PROTOCOLS:-TLSv1.2 TLSv1.3}"
      PROXY_SSL_VERIFY: "${PROXY_SSL_VERIFY:-off}"
      PROXY_SSL_VERIFY_DEPTH: "${PROXY_SSL_VERIFY_DEPTH:-1}"
      PROXY_TIMEOUT: "${PROXY_TIMEOUT:-60s}"
      REAL_IP_HEADER: "${REAL_IP_HEADER:-X-REAL-IP}"
      REAL_IP_PROXY_HEADER: "${REAL_IP_PROXY_HEADER:-X-REAL-IP}"
      REAL_IP_RECURSIVE: "${REAL_IP_RECURSIVE:-on}"
      REPORTING_LEVEL: "${REPORTING_LEVEL:-4}"
      RESOLVER_CONFIG: "${RESOLVER_CONFIG:-valid=5s}"
      RESTRICTED_EXTENSIONS: "${RESTRICTED_EXTENSIONS:-.asa/ .asax/ .ascx/ .axd/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .ini/ .key/ .licx/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pol/ .printer/ .pwd/ .rdb/ .resources/ .resx/ .sql/ .swp/ .sys/ .vb/ .vbs/ .vbproj/ .vsdisco/ .webinfo/ .xsd/ .xsx/}"
      RESTRICTED_HEADERS_BASIC: "${RESTRICTED_HEADERS_BASIC:-/content-encoding/ /proxy/ /lock-token/ /content-range/ /if/ /x-http-method-override/ /x-http-method/ /x-method-override/}"
      RESTRICTED_HEADERS_EXTENDED: "${RESTRICTED_HEADERS_EXTENDED:-/accept-charset/}"
      SERVER_NAME: "${SERVER_NAME:-localhost}"
      SERVER_TOKENS: "${SERVER_TOKENS:-off}"
      SET_REAL_IP_FROM: "${SET_REAL_IP_FROM:-127.0.0.1}"
      SSL_CERT_FILE: "${SSL_CERT_FILE:-/etc/nginx/conf/server.crt}"
      SSL_CERT_KEY_FILE: "${SSL_CERT_KEY_FILE:-/etc/nginx/conf/server.key}"
      SSL_CIPHERS: "${SSL_CIPHERS:-ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384}"
      SSL_DH_BITS: "${SSL_DH_BITS:-2048}"
      SSL_OCSP_STAPLING: "${SSL_OCSP_STAPLING:-on}"
      SSL_PORT: "${SSL_PORT:-8443}"
      SSL_PREFER_CIPHERS: "${SSL_PREFER_CIPHERS:-off}"
      SSL_PROTOCOLS: "${SSL_PROTOCOLS:-TLSv1.2 TLSv1.3}"
      SSL_VERIFY: "${SSL_VERIFY:-off}"
      SSL_VERIFY_DEPTH: "${SSL_VERIFY_DEPTH:-1}"
      STATIC_EXTENSIONS: "${STATIC_EXTENSIONS:-/.jpg/ /.jpeg/ /.png/ /.gif/ /.js/ /.css/ /.ico/ /.svg/ /.webp/}"
      VALIDATE_UTF8_ENCODING: "${VALIDATE_UTF8_ENCODING:-0}"
      WORKER_CONNECTIONS: "${WORKER_CONNECTIONS:-1024}"
    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./nginx/99-cert-reload.sh:/docker-entrypoint.d/99-cert-reload.sh:ro
      - ./nginx/srv:/srv:ro
      - front-dist:/usr/share/nginx/html:ro
      - nginx-secrets:/secrets:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      frontend-secrets:
        condition: service_completed_successfully
      nginx-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - core-network
      - monitoring-network

  certbot:
    image: ghcr.io/transummer2026/certbot:latest
    container_name: pollpear-certbot
    entrypoint: ["/bin/sh", "/renew-loop.sh"]
    volumes:
      - ./nginx/renew-loop.sh:/renew-loop.sh:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    restart: unless-stopped

  gateway:
    build:
      target: prod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s

  backend:
    build:
      target: prod
    command: ["node", "dist/src/main"]

  frontend:
    build:
      target: prod
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - front-dist:/out

  frontend-secrets:
    image: pollpear-vault:dev
    container_name: pollpear-frontend-secrets
    user: root
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      SERVICE: pollpear-frontend
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-agent-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-agent-entrypoint.sh:/usr/local/bin/vault-agent-entrypoint.sh:ro
      - ./vault-agent/agent-frontend.hcl:/agent/agent.hcl:ro
      - front-dist:/secrets
    depends_on:
      vault:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - core-network

  nginx-secrets:
    image: pollpear-vault:dev
    container_name: pollpear-nginx-secrets
    user: root
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      SERVICE: pollpear-nginx
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-agent-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-agent-entrypoint.sh:/usr/local/bin/vault-agent-entrypoint.sh:ro
      - ./vault-agent/agent-nginx.hcl:/agent/agent.hcl:ro
      - nginx-secrets:/secrets
    depends_on:
      vault:
        condition: service_healthy
    restart: on-failure
    networks:
      - core-network

  ai:
    build:
      target: prod
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "3002", "--workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/health', timeout=4)"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s

  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

volumes:
  certbot-certs:
    name: pollpear-certbot-certs
  certbot-webroot:
    name: pollpear-certbot-webroot
  front-dist:
    name: pollpear-front-dist
  nginx-secrets:
    name: pollpear-nginx-secrets