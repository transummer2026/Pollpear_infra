# Default Prometheus datasource, provisioned (non-editable) so it matches the
# dashboards' fixed "prometheus" uid. `access: proxy` = Grafana queries it server-side.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
