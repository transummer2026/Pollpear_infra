# Auto-load dashboards from the mounted JSON files into the "Pollpear" folder.
# Kept read-only from the UI so the files in git stay the source of truth.
apiVersion: 1

providers:
  - name: pollpear
    folder: Pollpear
    type: file
    options:
      path: /var/lib/grafana/dashboards
    allowUiUpdates: false
    updateIntervalSeconds: 30
    disableDeletion: true
