services:
  gateway:
    build:
      target: dev
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
  backend:
    build:
      target: dev
    ports:
      - "3000:3000"
    
  frontend:
    build:
      target: dev
    ports:
      - "5173:5173"
    
  ai:
    build:
      target: dev
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/health', timeout=4)"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
  postgres:
    ports:
      - "5432:5432"
  studio:
    build:
      context: ./../Pollpear_backend
      dockerfile: Dockerfile
      target: dev
    image: pollpear-studio:dev
    container_name: pollpear-studio
    command: ["npx", "prisma", "studio", "--port", "5555", "--browser", "none"]
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-network
  redis:
    ports:
      - "6379:6379"
  garage:
    ports:
      - "3900:3900"
      - "3902:3902"
  vault:
    build:
      context: ./../Pollpear_cyber
      dockerfile: Dockerfile
    image: pollpear-vault:dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-root}
    ports:
      - "8200:8200"
    volumes:
      - vault-logs:/vault/logs
    post_start:
      - command:
          - /bin/sh
          - -c
          - until vault status >/dev/null 2>&1; do sleep 1; done; vault audit list 2>/dev/null | grep -q 'file/' || vault audit enable file file_path=/vault/logs/audit.log
        environment:
          VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-root}

volumes:
  vault-logs:
    name: pollpear-vault-logs
