services:
  backend:
    build:
      target: dev
    ports:
      - "3000:3000"
  frontend:
    build:
      target: dev
    ports:
      - "5173:5173"
  postgres:
    ports:
      - "5432:5432"
  studio:
    build:
      context: ./../Pollpear_backend
      dockerfile: Dockerfile
      target: dev
    image: pollpear-studio:dev
    container_name: pollpear-studio
    command: ["npx", "prisma", "studio", "--port", "5555", "--browser", "none"]
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-network
  redis:
    ports:
      - "6379:6379"
  vault:
    build:
      context: ./../Pollpear_cyber
      dockerfile: Dockerfile
    image: pollpear-vault:dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-root}
    ports:
      - "8200:8200"
    volumes:
      - vault-logs:/vault/logs
    post_start:
      - command:
          - /bin/sh
          - -c
          - until vault status >/dev/null 2>&1; do sleep 1; done; vault audit list 2>/dev/null | grep -q 'file/' || vault audit enable file file_path=/vault/logs/audit.log
        environment:
          VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-root}
  prometheus:
    ports:
      - "9090:9090"
  grafana:
    ports:
      - "9091:3000"
  alertmanager:
    ports:
      - "9093:9093"

volumes:
  vault-logs:
