services:
  gateway:
    build:
      target: dev
    image: pollpear-gateway:dev
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
  backend:
    build:
      target: dev
    image: pollpear-backend:dev
    command: ["npm", "run", "start:dev"]
    ports:
      - "3000:3000"

  frontend:
    build:
      target: dev
    image: pollpear-frontend:dev
    ports:
      - "5173:5173"
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-approle-entrypoint.sh"]
    command: ["sh", "-c", "node scripts/vault-config.mjs && npm run dev"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-approle-entrypoint.sh:/usr/local/bin/vault-approle-entrypoint.sh:ro
    depends_on:
      vault:
        condition: service_healthy

  ai:
    build:
      target: dev
    image: pollpear-ai:dev
    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "3002",
        "--reload",
      ]
    ports:
      - "3002:3002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3002/health', timeout=4)",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 0s
      start_interval: 5s
  postgres:
    ports:
      - "5432:5432"
  studio:
    build:
      context: ./../Pollpear_backend
      dockerfile: Dockerfile
      target: dev
    image: pollpear-studio:dev
    container_name: pollpear-studio
    command: ["npx", "prisma", "studio", "--port", "5555", "--browser", "none"]
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      APPROLE_ENV: pollpear-backend.env
    entrypoint: ["/bin/sh", "/usr/local/bin/vault-approle-entrypoint.sh"]
    volumes:
      - vault-approle:/vault/approle:ro
      - ./scripts/vault-approle-entrypoint.sh:/usr/local/bin/vault-approle-entrypoint.sh:ro
    ports:
      - "5555:5555"
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend-network
  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
  garage:
    ports:
      - "3900:3900"
      - "3902:3902"
  vault:
    ports:
      - "8200:8200"
